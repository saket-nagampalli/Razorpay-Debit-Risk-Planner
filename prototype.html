  --ok:#4ade80; --ok-soft:#143022; --mute-soft:#1c2533; --wa:#5fd3a6; --wa-bg:#101a17; --wa-out:#1e3a2c; --wa-in:#1b2420; color-scheme:dark}

.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}

nav .step{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.navfoot{margin-top:auto;font-size:11.5px;color:var(--ink3);padding:10px 8px;border-top:1px solid var(--line);line-height:1.45}
main{padding-block:28px 60px;padding-inline:clamp(16px,3.5vw,40px);min-width:0}
.screen{display:flex;flex-direction:column;gap:20px;max-width:1080px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600}
h1{font-size:26px;letter-spacing:-.02em;margin:4px 0 0;text-wrap:balance;font-weight:600}
h2{font-size:17px;margin:0;font-weight:600}
p{margin:0}
.lead{color:var(--ink2);max-width:68ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.pad{padding:18px 20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:14px 16px}

.kpi .l{font-size:12.5px;color:var(--ink2)}
.btn{all:unset;cursor:pointer;padding:9px 14px;border-radius:8px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0c121c}}
.btn.danger{color:var(--hi);border-color:var(--hi)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-hi{background:var(--hi-soft);color:var(--hi)} .p-mid{background:var(--mid-soft);color:var(--mid)} .p-lo{background:var(--mute-soft);color:var(--ink2)}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-acc{background:var(--accent-soft);color:var(--accent)}
.groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.group{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.group .t{font-weight:600}
.group .s{font-size:13px;color:var(--ink2)}
.group .n{font-family:var(--mono);font-size:13px;color:var(--ink)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);text-align:left;font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer} tr.click:hover td{background:var(--mute-soft)}
tr.priya td{background:var(--accent-soft)}
td .sub{font-size:12.5px;color:var(--ink2)}
.bar{height:6px;border-radius:3px;background:var(--mute-soft);width:70px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--hi)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 18px;border-radius:12px;background:var(--ok-soft);color:var(--ok);font-weight:600}
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
.reason{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.reason:last-child{border-bottom:0}
.reason .w{font-family:var(--mono);font-size:12px;color:var(--hi);min-width:52px}
.timeline{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;margin-top:10px}
.cell{height:34px;border-radius:5px;display:flex;align-items:flex-end;justify-content:center;font-size:10px;font-family:var(--mono);color:var(--ink3);padding-bottom:2px;position:relative}
.cell.on_time{background:var(--ok-soft)} .cell.retry{background:var(--mid-soft)} .cell.recovered{background:var(--hi-soft)} .cell.lost{background:var(--hi)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.plan{display:flex;flex-direction:column;gap:0}
.plan .st{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.plan .st:last-child{border-bottom:0}

.alt{font-size:13px;color:var(--ink2);padding:10px 12px;border-radius:8px;background:var(--mute-soft)}
.settings{display:flex;flex-direction:column}
.set{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:16px 20px;border-bottom:1px solid var(--line);align-items:center}
.set:last-child{border-bottom:0}
.set .h{font-weight:600}
.set .d{font-size:13.5px;color:var(--ink2);max-width:62ch}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:12px;background:var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(18px)}

.phones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}

.chat{padding:14px;display:flex;flex-direction:column;gap:8px;min-height:420px}

.msg.out{align-self:flex-end;background:var(--wa-out)}
.msg .tm{display:block;text-align:right;font-size:10.5px;color:var(--ink3);margin-top:3px}
.qr{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

.qr button[disabled]{opacity:.45;cursor:default}
.note{font-size:12.5px;color:var(--ink3)}
.ab{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));font-size:14px}
.ab div{padding:11px 14px;border-bottom:1px solid var(--line)}
.ab .hd{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:600}
.ab .n{font-family:var(--mono);text-align:right}
.ab .good{color:var(--ok);font-weight:600}
.learn{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.learn .card{padding:16px;display:flex;flex-direction:column;gap:8px}
.chartbox{overflow-x:auto}
svg text{font-family:var(--sans)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:20}
.back{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:14px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  nav{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;overflow-x:auto;padding-block:8px;padding-inline:12px;border-right:0;border-bottom:1px solid var(--line);z-index:5}

  nav button{white-space:nowrap}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .groups,.learn{grid-template-columns:1fr}
  .two,.phones{grid-template-columns:1fr}
  .ab{grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));font-size:13px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  };
  let tm = 4;
  (state.rayPicks||[]).forEach(q=>{ msgs.push({who:"out", t:q, t2:`8:0${tm} am`}); if (R[q]) msgs.push({who:"in", t:R[q].t, qr:R[q].qr, t2:`8:0${tm} am`}); tm=Math.min(tm+1,9); });
  if (state.approved) { msgs.push({who:"out", t:"Approve plan", t2:`8:0${tm} am`}); msgs.push({who:"in", t:`Approved. Reminders go out 2 days before each renewal; I'll report results on Monday. Reply <b>STOP</b> any time to pause the agent.`, t2:`8:0${tm} am`}); }
  const last = msgs.length - 1;
  return `<section class="screen">
    <div><div class="eyebrow">RAY on WhatsApp · merchant view</div><h1>The founder approves the week in one tap</h1>
    <p class="lead" style="margin-top:6px">SkillUp's founder runs the business from her phone. The agent sends one summary a week, takes rule changes in plain language and shows what each change costs before saving it.</p></div>
    <div class="phones"><div class="phone"><div class="top"><b>RAY · Razorpay</b><span>Agent Studio · Debit Risk Planner</span></div>
    <div class="chat">${msgs.map((m,i)=>`<div class="msg ${m.who==="out"?"out":""}">${m.t}<span class="tm">${m.t2}</span>${m.qr && i===last && !state.approved?`<div class="qr">${m.qr.map(q=>`<button data-ray="${q}">${q}</button>`).join("")}</div>`:""}</div>`).join("")}</div></div>
    <div class="card pad" style="display:flex;flex-direction:column;gap:10px"><h2>What the agent is doing here</h2>
      <p class="note" style="font-size:14px;color:var(--ink2)">Summarises the risk model's output, proposes the plan, turns a typed instruction into a policy rule, prices it in ₹ before saving, and waits for approval. It never changes the plan on its own.</p>
      <p class="note">Try: Change rules, then the suggested rule, then Confirm and Approve. Rule-change figures in this chat are illustrative.</p>
      <button class="btn" data-resetray style="align-self:flex-start">Reset chat</button></div></div>
  </section>`;
}

function customerScreen(){
  const c = state.customer;
  const reply = c==="Remind me on the 7th" ? "Sure. We'll try on 8 Oct, after your salary day. Your access continues as normal." : c==="I've added money" ? "Thanks, Priya. Your renewal will go through on 1 Oct as planned." : c==="Stop reminders" ? "Done. You won't get renewal reminders from SkillUp again. Your plan is unchanged." : "";
  return `<section class="screen">
    <div><div class="eyebrow">Customer view · sent in SkillUp's name, only with WhatsApp opt-in</div><h1>Priya gets one useful message, two days early</h1>
    <p class="lead" style="margin-top:6px">An approved utility template, filled in by the agent. No discounts, no pressure, an easy opt-out. Low-risk customers get nothing extra beyond the bank's standard notice.</p></div>
    <div class="phones"><div class="phone"><div class="top"><b>SkillUp</b><span>Business account</span></div>
      <div class="chat">
        <div class="msg">Hi Priya, your SkillUp Pro plan renews on <b>1 Oct</b> for <b>₹2,999</b> via UPI AutoPay from your account ending 4471.<br><br>If your balance is low before payday, tell us and we'll time the payment better.<span class="tm">29 Sep, 6:30 pm</span>
        ${c?"":`<div class="qr">${["I've added money","Remind me on the 7th","Stop reminders"].map(q=>`<button data-cust="${q}">${q}</button>`).join("")}</div>`}</div>
        ${c?`<div class="msg out">${c}<span class="tm">6:41 pm</span></div><div class="msg">${reply}<span class="tm">6:41 pm</span></div>`:""}
      </div></div>
      <div class="card pad" style="display:flex;flex-direction:column;gap:10px"><h2>How the agent handles each reply</h2>
      <div class="reason"><span class="w">Added</span><span>Debit stays on 1 Oct. Outcome logged.</span></div>
      <div class="reason"><span class="w">7th</span><span>Retry moved to 8 Oct within the 1 + 3 attempt limit. Access is not paused, and no free days: the billing cycle is unchanged.</span></div>
      <div class="reason"><span class="w">Stop</span><span>Opt-out saved permanently. Only silent actions (retry timing) from now on.</span></div>
      <div class="reason"><span class="w">Other</span><span>Complaints, disputes or "cancel" go to SkillUp's normal flow. The agent never argues or offers discounts on its own.</span></div>
      ${c?`<button class="btn" data-resetcust style="align-self:flex-start">Reset</button>`:""}</div></div>
  </section>`;
}

function policyScreen(){
  const p = state.policy;
  const sw = (k, h, d) => `<div class="set"><div><div class="h">${h}</div><div class="d">${d}</div></div><label class="switch"><input type="checkbox" id="pol-${k}" data-pol="${k}" ${p[k]?"checked":""} aria-label="${h}"><span></span></label></div>`;
  return `<section class="screen">
    <div><div class="eyebrow">Your rules · the agent acts only inside these</div><h1>You decide what the agent may do</h1>
    <p class="lead" style="margin-top:6px">Razorpay's platform also enforces fixed limits that no setting can override: NPCI's one attempt plus three retries in permitted windows, customer consent, permanent opt-outs and no dark patterns.</p></div>
    ${p.paused?`<div class="banner" style="background:var(--hi-soft);color:var(--hi)"><span>Agent paused. Renewals run on standard Razorpay retries.</span><button class="btn" data-pol-resume>Resume agent</button></div>`:""}
    <div class="card settings">
      ${sw("remind","WhatsApp reminders before the debit","Sent only when the expected gain beats the cost and the annoyance risk. Customers must have opted in.")}
      ${sw("retry","Plan retries around payday","Uses the likely payday to time retries inside the 1 + 3 attempt limit. Silent: no message.")}
      ${sw("mandate","Fix mandate problems early","Ask customers to re-approve a limit or update an expiring card before the debit fails.")}
      ${sw("shift","Offer a one-time billing date move","Off by default. In testing it did not add value. When on: once a year, prorated, never free days.")}
      <div class="set"><div><div class="h">Messages per customer per month</div><div class="d">Hard cap across all reminders.</div></div><select id="pol-cap" data-cap>${["1","2","3"].map(v=>`<option ${p.cap===v?"selected":""}>${v}</option>`).join("")}</select></div>
      <div class="set"><div><div class="h">Approval mode</div><div class="d">Review-first: you approve each weekly plan. Auto: routine actions run within these rules and you get a summary.</div></div><select id="pol-mode" data-mode><option value="review" ${p.mode==="review"?"selected":""}>Review-first</option><option value="auto" ${p.mode==="auto"?"selected":""}>Auto within rules</option></select></div>
    </div>
    <div class="row"><button class="btn danger" data-pol-stop>Stop agent now</button><span class="note">Takes effect immediately. Everything returns to standard Razorpay behaviour.</span></div>
  </section>`;
}

function outcomesScreen(){
  const rows = [["First attempt succeeds","84.3%","82.7%","+1.6 pts"],["Renewal collected within the cycle","95.9%","94.3%","+1.6 pts"],["Never collected","3.5%","5.1%","−31%"],["Cancelled after the renewal","2.75%","2.96%","−7%"],["WhatsApp messages per renewal","0.37","0","cost ₹0.18"]];
  const sens = [["Base case",3.2],["Reminders work half as well",-0.6],["Reminders have no effect",-4.0],["Reminder fatigue 3×",-11.5]];
  const learned = {"Reminders work half as well":0.9,"Reminders have no effect":5.3,"Reminder fatigue 3×":1.0};
  const W=560, H=210, x0=220, sc=(W-x0-30)/30, zero=x0+15*sc;
  const svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="Planner advantage over rules by scenario"><title>Planner minus best rules, ₹ lakh</title>
    <line x1="${zero}" y1="18" x2="${zero}" y2="${H-26}" stroke="var(--ink3)" stroke-width="1"/>
    ${[-15,-10,-5,0,5,10,15].map(v=>`<text x="${zero+v*sc}" y="${H-8}" font-size="11" fill="var(--ink3)" text-anchor="middle">${v>0?"+":""}${v}</text>`).join("")}
    ${sens.map((s,i)=>{const y=28+i*42, v=s[1], x=Math.min(zero,zero+v*sc), w=Math.abs(v*sc); const L=learned[s[0]];
      return `<text x="${x0-10}" y="${y+12}" font-size="12.5" fill="var(--ink)" text-anchor="end">${s[0]}</text>
      <rect x="${x}" y="${y}" width="${Math.max(w,1)}" height="16" rx="3" fill="${v>=0?"var(--accent)":"var(--ink3)"}" opacity="${v>=0?1:.55}"/>
      <text x="${v>=0?zero+w+6:x-6}" y="${y+12}" font-size="11.5" fill="var(--ink2)" text-anchor="${v>=0?"start":"end"}">${v>0?"+":""}${v}</text>
      ${L!==undefined?`<rect x="${zero+L*sc-5}" y="${y+3}" width="10" height="10" transform="rotate(45 ${zero+L*sc} ${y+8})" fill="var(--ok)"/>`:""}`;}).join("")}
  </svg>`;
  return `<section class="screen">
    <div><div class="eyebrow">Results · simulated pilot, Aug–Sep 2026 · treated vs 10% control group</div><h1>The control group shows what the agent really adds</h1>
    <p class="lead" style="margin-top:6px">Every week 10% of renewals get no agent action. Comparing them with the rest measures the true effect and corrects the agent's assumptions.</p></div>
    <div class="card"><div class="ab">
      <div class="hd">Per renewal</div><div class="hd n">With agent</div><div class="hd n">Control</div><div class="hd n">Change</div>
      ${rows.map(r=>`<div>${r[0]}</div><div class="n">${r[1]}</div><div class="n">${r[2]}</div><div class="n good">${r[3]}</div>`).join("")}
    </div><p class="note pad" style="padding-top:10px">SkillUp, per month: collection 92.4% → 95.2%, about ₹5.8 L more cash, never-collected renewals 487 → 313. Synthetic data; a real pilot would measure this on 3 merchants over 4–8 weeks.</p></div>
    <div class="learn">
      <div class="card"><span class="pill p-ok" style="align-self:flex-start">Measured (illustrative)</span><b>Reminders cut low-balance failures 20% for medium and high risk</b><p class="note">In line with the assumption. Reminder volume unchanged.</p></div>
      <div class="card"><span class="pill p-mid" style="align-self:flex-start">Adjusted (illustrative)</span><b>Low-risk customers reminded cancel slightly more</b><p class="note">Agent raised the risk threshold for reminders from 8% to 12%. 140 fewer messages a week.</p></div>
      <div class="card"><span class="pill p-acc" style="align-self:flex-start">Next test</span><b>Champion vs challenger: reminder 2 days vs 3 days before</b><p class="note">Split 50/50 inside the treated group; winner promoted only if cancellations don't rise.</p></div>
    </div>
    <div class="card pad"><h2>Why learning matters: planner minus best fixed rules, ₹ lakh over 2 months</h2>
      <p class="note" style="margin-top:4px">Bars: planner keeping its starting assumptions. Green diamonds: after it updates them from the control group.</p>
      <div class="chartbox" style="margin-top:10px">${svg}</div>
      <p class="note">If reminders work worse than assumed, a fixed planner loses to good rules. After learning from the control group it wins in every case tested; when reminders don't work, it simply stops sending them.</p></div>
  </section>`;
}

const SCREENS = {plan:planScreen, detail:()=>detailScreen(state.detailId), ray:rayScreen, customer:customerScreen, policy:policyScreen, outcomes:outcomesScreen};
function render(id){
  if (!SCREENS[id]) id = "plan";
  document.getElementById("main").innerHTML = SCREENS[id]();
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-current", b.dataset.go===id ? "true":"false"));
  state.current = id;
}
function savePolicy(){ try { localStorage.setItem("drp-policy", JSON.stringify(state.policy)); } catch(e) {} }
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-go],[data-row],[data-approve],[data-undo],[data-ok],[data-skip],[data-ray],[data-resetray],[data-cust],[data-resetcust],[data-pol-stop],[data-pol-resume]");
  if (!t) return;
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.row) { state.detailId = +t.dataset.row; location.hash="detail"; render("detail"); window.scrollTo(0,0); return; }
  if (t.hasAttribute("data-approve")) { state.approved = true; render("plan"); return toast("Plan approved"); }
  if (t.hasAttribute("data-undo")) { state.approved = false; render(state.current); return toast("Approval undone"); }
  if (t.dataset.ok) return toast(`Approved for ${t.dataset.ok}`);
  if (t.dataset.skip) return toast(`${t.dataset.skip} skipped this week`);
  if (t.dataset.ray) { const q=t.dataset.ray; if (q==="Approve plan") state.approved=true; else state.rayPicks=[...(state.rayPicks||[]), q]; render("ray"); return; }
  if (t.hasAttribute("data-resetray")) { state.rayPicks=[]; state.approved=false; render("ray"); return; }
  if (t.dataset.cust) { state.customer=t.dataset.cust; render("customer"); return; }
  if (t.hasAttribute("data-resetcust")) { state.customer=null; render("customer"); return; }
  if (t.hasAttribute("data-pol-stop")) { state.policy.paused=true; savePolicy(); render("policy"); return toast("Agent stopped"); }
  if (t.hasAttribute("data-pol-resume")) { state.policy.paused=false; savePolicy(); render("policy"); return toast("Agent resumed"); }
});
document.addEventListener("change", e=>{
  const t = e.target;
  if (t.dataset.pol) { state.policy[t.dataset.pol] = t.checked; savePolicy(); toast(t.checked ? "Action switched on" : "Action switched off"); }
  if (t.hasAttribute("data-cap")) { state.policy.cap = t.value; savePolicy(); toast(`Cap set to ${t.value} per customer per month`); }
  if (t.hasAttribute("data-mode")) { state.policy.mode = t.value; savePolicy(); toast(t.value==="auto" ? "Auto within rules" : "Review-first"); }
});
window.addEventListener("hashchange", ()=>{ const h=location.hash.slice(1); if (h!==state.current) render(SCREENS[h]?h:"plan"); });
const start = (location.hash||"#plan").slice(1);
render(SCREENS[start] ? start : "plan");
</script>
